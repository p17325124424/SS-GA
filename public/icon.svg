<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Tooth Base Glow / Shadow -->
  <g filter="url(#softShadow)">
    <!-- Cute Tooth Silhouette -->
    <path d="M 170 120
             C 130 120 100 150 100 200
             C 100 250 120 300 150 380
             C 170 430 210 430 230 380
             C 245 340 250 330 256 330
             C 262 330 267 340 282 380
             C 302 430 342 430 362 380
             C 392 300 412 250 412 200
             C 412 150 382 120 342 120
             C 302 120 276 140 256 145
             C 236 140 210 120 170 120 Z"
          fill="url(#toothGrad)" />
  </g>

  <!-- Cute Eyes -->
  <ellipse cx="205" cy="225" rx="14" ry="18" fill="#1e293b" />
  <circle cx="210" cy="219" r="5" fill="#ffffff" />
  <ellipse cx="307" cy="225" rx="14" ry="18" fill="#1e293b" />
  <circle cx="312" cy="219" r="5" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <circle cx="175" cy="250" r="16" fill="#f43f5e" opacity="0.35" />
  <circle cx="337" cy="250" r="16" fill="#f43f5e" opacity="0.35" />

  <!-- Joyful Smile -->
  <path d="M 220 250 Q 256 285 292 250" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
  <!-- Tongue -->
  <path d="M 242 267 Q 256 283 270 267 Z" fill="#fb7185" />

  <!-- Sparkles -->
  <path d="M 370 100 Q 385 115 400 115 Q 385 115 370 130 Q 385 115 370 100" fill="url(#sparkleGrad)" transform="translate(10, 0) scale(1.3)" />
  <circle cx="395" cy="95" r="4" fill="#fef08a" />
  <circle cx="130" cy="150" r="6" fill="#fef08a" opacity="0.9" />

  <!-- Bubbles -->
  <circle cx="140" cy="300" r="10" fill="#ffffff" opacity="0.5" />
  <circle cx="370" cy="290" r="14" fill="#ffffff" opacity="0.4" />
  <circle cx="385" cy="320" r="8" fill="#ffffff" opacity="0.6" />
</svg>
